name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python public tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Check Python source and dependencies
        run: |
          python -m ruff check .
          python -m pip check
      - name: Run offline public test profile
        run: python -m scripts.public_tests -q --junitxml=output/ci/pytest.xml
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-test-report
          path: output/ci/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
          npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-build
          path: apps/web/dist
          retention-days: 7

  browser:
    name: Browser Mock flow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Chinese fonts for browser evidence
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          python - <<'PY'
          import subprocess
          family = subprocess.check_output(
              ["fc-match", "--format=%{family}", "Noto Sans CJK SC"], text=True
          )
          assert "Noto Sans CJK SC" in family, family
          PY
      - name: Install locked application dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          npm ci --prefix apps/web
      - name: Run synthetic browser workflow with installed Chrome
        run: |
          chrome=$(command -v google-chrome)
          python -m scripts.public_e2e --allow-loopback-cors --chrome "$chrome"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-evidence
          path: output/ci/public-e2e
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required CI
    if: always()
    needs: [backend, frontend, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all verification jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items()
                    if value['result'] != 'success'}
          if failed:
              raise SystemExit(str(failed))
          print('All public verification jobs passed')
          PY
