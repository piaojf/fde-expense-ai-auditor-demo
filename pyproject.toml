[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-expense-ai-auditor"
version = "0.1.0"
description = "智能ai财务审批系统 — AI advice with human finance approval"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "alembic>=1.14,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain>=1,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=13,<14",
  "pypdfium2>=4.30,<6",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "PyYAML>=6,<7"]
embeddings = ["sentence-transformers>=3,<7"]
[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api*", "agent*", "domain*", "rules*", "rag*", "integrations*", "database*", "evals*"]
namespaces = true
[tool.setuptools.package-data]
"apps.api" = ["mock_data/*.json"]
"rag" = ["seed/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a disposable PostgreSQL database with pgvector",
  "live_llm: opt-in paid DeepSeek and remote BGE-M3 API acceptance",
]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", ".m0-evidence", ".m4a-evidence", ".m4b-evidence", ".m4b-runtime"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

